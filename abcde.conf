# abcde-Konfiguration: Audio-CD -> FLAC, ohne Rueckfragen

OUTPUTTYPE=flac
OUTPUTDIR=/output
WAVOUTPUTDIR=/tmp

# Metadaten (Interpret, Album, Titel) von MusicBrainz holen
CDDBMETHOD=musicbrainz

# Fehlerkorrigierendes Auslesen
CDROMREADERSYNTAX=cdparanoia
CDPARANOIAOPTS="--never-skip=40"

# Hoechste Kompression, mit Verifikation (verlustfrei bleibt es immer).
# Fuer MP3-Rips setzt rip.sh RIP_FLACOPTS auf eine schnelle Stufe, weil die FLAC-Datei
# dann nur ein Zwischenschritt ist.
FLACOPTS="${RIP_FLACOPTS:--s -V -8}"

ACTIONS=cddb,read,encode,tag,move,clean
INTERACTIVE=n
PADTRACKS=y
EJECTCD=n          # Auswerfen uebernimmt rip.sh

# Ordnerstruktur: Interpret/Album/01 - Titel.flac
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

# Leerzeichen und Umlaute behalten, nur problematische Zeichen entfernen.
# Windows kann Ordner und Dateien nicht oeffnen, deren Name mit einem Punkt oder Leerzeichen endet
# (z. B. das Album "Onkelz wie wir..."), deshalb werden diese am Ende abgeschnitten.
mungefilename ()
{
    local name
    name=$(echo "$@" | tr -d ':><|*/"?\\[:cntrl:]' | sed -e 's/^\.*//' -e 's/[. ]*$//')
    echo "${name:-_}"
}
